plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vrheadsetmanager.adbwifi'
    compileSdk 35

    defaultConfig {
        applicationId "com.vrheadsetmanager.adbwifi"
        // Quest 2 / Quest 3 run Android 12-14 based builds (wireless debugging needs 11+)
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Quest 2 and Quest 3 are arm64 only; the bundled adb client is arm64 only
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with Android's debug keystore so the APK installs directly with
            // 'adb install' - no keystore setup. Sideload only, never publish it to a store.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // Extract libadb.so to nativeLibraryDir: it is executed as a program, so it
            // must exist as a real file on disk (not mapped from inside the APK).
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // mDNS discovery of the random "wireless debugging" TLS port
    implementation 'org.jmdns:jmdns:3.5.8'
}
