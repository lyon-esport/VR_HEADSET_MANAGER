org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# The repo lives under a path containing an accented char ("partages" with an e-acute).
# Android's build tools reject non-ASCII paths by default; this override allows the build.
# If the build still fails on aapt2/resource steps, copy android_companion to a plain
# ASCII path (e.g. C:\vrhm_companion) and build there instead.
android.overridePathCheck=true
