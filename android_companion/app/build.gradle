plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def probeCatalogSrc = file("$rootDir/../templates/companion/probes.json")
def probeAssetsDir = layout.buildDirectory.dir("generated/vrhm-assets").get().asFile

android {
    namespace 'com.vrheadsetmanager.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.vrheadsetmanager.companion"
        minSdk 29
        targetSdk 34
        versionCode 14
        versionName "1.4.3"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign the release APK with Android's built-in debug keystore.
            // This keeps the package id 'com.vrheadsetmanager.companion' and makes the
            // APK directly installable via 'adb install' - no keystore setup required.
            // Sideload only; do NOT publish a debug-signed APK to any store.
            signingConfig signingConfigs.debug
        }
        debug {
            // No applicationIdSuffix: keep the same package id in both variants so the
            // 'pm grant com.vrheadsetmanager.companion ...' commands work for either build.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            kotlin.srcDirs = ['src/main/kotlin']
            assets.srcDirs += [probeAssetsDir]
        }
        test {
            kotlin.srcDirs = ['src/test/kotlin']
        }
    }

    testOptions {
        unitTests.all {
            // Shared parity fixtures and the catalogue (T6.1 owns both files).
            systemProperty 'vrhm.fixtures', file('../../scripts/companionFixtures').absolutePath
            systemProperty 'vrhm.catalog', probeCatalogSrc.absolutePath
        }
    }
}

// Single-source probe catalogue (local-probes.md 2.1): copied into the APK assets at build time.
tasks.register('copyProbeCatalog', Copy) {
    doFirst {
        if (!probeCatalogSrc.exists()) throw new GradleException("Probe catalogue missing: " + probeCatalogSrc)
    }
    from(probeCatalogSrc)
    into(probeAssetsDir)
}
tasks.named('preBuild') { dependsOn 'copyProbeCatalog' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    // Embedded HTTP server (~250 KB)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    // Self-ADB (wireless debugging client, TLS + classic)
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}

