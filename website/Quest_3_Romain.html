<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5">
    <title>Quest 3 Romain VR Headset - Status</title>

    <style>
      :root {
        --text: #e5e7eb;     /* gris clair */
        --accent: #60a5fa;   /* bleu */
        --muted: #94a3b8;    /* gris bleuté */
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: transparent !important; /* clé pour OBS */
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 92vw);
        background: transparent;  /* aucun fond pour l'incrustation */
        border: none;
        border-radius: 16px;
        padding: 28px 32px;
        box-shadow: none;
        backdrop-filter: none;
        text-align: center;
      }
      .title {
        margin: 0 0 16px 0;
        font-size: clamp(28px, 5vw, 38px);
        font-weight: 800;
        letter-spacing: 0.6px;
        color: var(--accent);
        text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      }
      .values {
        font-size: clamp(24px, 4.5vw, 34px);
        line-height: 1.3;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
        text-shadow: 0 2px 6px rgba(0,0,0,0.35);
      }

      /* Styles communs */
      .batt, .temp {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid transparent;
        color: #fff; /* texte toujours blanc par défaut */
      }
      .batt .emoji, .temp .emoji {
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
      }
      .muted { color: var(--muted); font-weight: 500; }

      /* États batterie (fond/bordure uniquement, texte reste blanc) */
      .batt--low {                       /* <= 30% : rouge */
        background: rgba(239, 68, 68, 0.18);
        border-color: rgba(239, 68, 68, 0.35);
		color: red;
      }
      .batt--mid {                       /* 31–59% : orange */
        background: rgba(245, 158, 11, 0.18);
        border-color: rgba(245, 158, 11, 0.35);
		color: orange;
      }
      .batt--ok {                        /* >= 60% : bleu (style actuel) */
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.25);
		color: white;
      }

      /* Température normale (bleu) */
      .temp {
        background: rgba(96,165,250,0.12);
        border-color: rgba(96,165,250,0.25);
		color: white;
      }
      /* Température chaude > 50 °C : fond + texte rouges */
      .temp--hot {
        background: rgba(239, 68, 68, 0.20);
        border-color: rgba(239, 68, 68, 0.45);
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="card" role="main" aria-label="Statut Quest 3 Romain">
        <h1 class="title">Quest 3 Romain
           <span class="muted">
            ☠️
        </span>
        </h1>
        <div class="values" aria-live="polite">
          <span class="batt" aria-label="Batterie en pourcent">
            <span class="emoji" aria-hidden="true">
            🪫
            </span>
            <strong>- %</strong>
            <span class="muted">
              ⚡
            </span>
            
          </span>
          <span class="temp" aria-label="Température en Celsius">
            <span class="emoji" aria-hidden="true">
              ❄️
            </span>
            <strong>-&nbsp;°C</strong>
          </span>
        </div>
      </main>
    </div>

    <script>
      function applyBatteryClass() {
        const batt = document.querySelector('.batt');
        if (!batt) return;

        const strong = batt.querySelector('strong');
        if (!strong) return;

        const num = parseInt((strong.textContent || '').replace(/\D/g, ''), 10);
        if (isNaN(num)) return;

        batt.classList.remove('batt--low', 'batt--mid', 'batt--ok');

        if (num <= 30) {
          batt.classList.add('batt--low');   // rouge
        } else if (num < 60) {
          batt.classList.add('batt--mid');   // orange
        } else {
          batt.classList.add('batt--ok');    // bleu
        }
      }

      function applyTempClass() {
        const temp = document.querySelector('.temp');
        if (!temp) return;

        const strong = temp.querySelector('strong');
        if (!strong) return;

        // Ex: "52 °C" -> 52
        const t = parseInt((strong.textContent || '').replace(/\D/g, ''), 10);
        if (isNaN(t)) return;

        temp.classList.toggle('temp--hot', t > 50 );
      }

      // Au chargement
      document.addEventListener('DOMContentLoaded', () => {
        applyBatteryClass();
        applyTempClass();
      });

      // Observer les changements dynamiques
      const battTarget = document.querySelector('.batt strong');
      if (battTarget) {
        const moBatt = new MutationObserver(applyBatteryClass);
        moBatt.observe(battTarget, { characterData: true, childList: true, subtree: true });
      }

      const tempTarget = document.querySelector('.temp strong');
      if (tempTarget) {
        const moTemp = new MutationObserver(applyTempClass);
        moTemp.observe(tempTarget, { characterData: true, childList: true, subtree: true });
      }
    </script>
  </body>
</html>
