<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known Apps - VR Headset Manager</title>
  <link rel="stylesheet" href="assets/topbar.css">
  <script src="assets/topbar.js"></script>
  <style>
    :root {
      --bg:         #1a1a1a;
      --bg2:        #242424;
      --bg3:        #2e2e2e;
      --bg4:        #383838;
      --border:     #3a3a3a;
      --text:       #e8e8e8;
      --text2:      #999;
      --accent:     #3b82f6;
      --success:    #22c55e;
      --danger:     #ef4444;
      --warn:       #f59e0b;
    }
    [data-theme="light"] {
      --bg:         #f0f0f0;
      --bg2:        #ffffff;
      --bg3:        #f5f5f5;
      --bg4:        #e8e8e8;
      --border:     #d8d8d8;
      --text:       #111111;
      --text2:      #666666;
      --accent:     #2563eb;
      --success:    #16a34a;
      --danger:     #dc2626;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

    .page-wrap { display: flex; flex-direction: column; height: 100vh; }

    .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 10px 14px 8px; gap: 8px; }

    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
    .action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--text); cursor: pointer; font-size: 12px;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .action-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
    .action-btn.danger:hover:not(:disabled) { background: var(--danger); color: #fff; border-color: var(--danger); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .table-card {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    }
    .table-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    /* Column widths */
    .col-el  { width: 34px; }
    .col-pkg { width: auto; min-width: 120px; }
    .col-dn  { width: 24%; }
    .col-iu  { width: 24%; }
    .col-li  { width: 14%; }
    .col-ty  { width: 80px; }
    .col-er  { width: 34px; }

    thead { position: sticky; top: 0; z-index: 4; }

    thead tr.hdr-row th {
      background: var(--bg3); border-bottom: 1px solid var(--border);
      padding: 7px 6px; text-align: left;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text2); white-space: nowrap; overflow: hidden;
    }

    thead tr.input-row td {
      background: var(--bg2); border-bottom: 2px solid var(--accent);
      padding: 4px 4px;
    }
    thead tr.input-row td.edit-mode-indicator {
      border-bottom-color: var(--warn);
    }
    thead tr.input-row input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 5px 7px; border-radius: 4px; font-size: 12px;
      outline: none; transition: border-color 0.12s;
    }
    thead tr.input-row input:focus { border-color: var(--accent); }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg3); }
    tbody tr.editing { background: rgba(59,130,246,0.07); }

    tbody td {
      padding: 5px 6px; vertical-align: middle;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    td.pkg-cell  { font-size: 12px; font-family: 'Consolas', monospace; }
    td.dn-cell   { font-size: 12px; }
    td.url-cell  { font-size: 11px; color: var(--text2); position: relative; padding-right: 28px; }

    .copy-btn {
      position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      display: none;
    }
    .copy-btn:hover { background: rgba(59,130,246,0.14); color: var(--accent); border-color: var(--accent); }
    tbody tr:hover .copy-btn { display: inline-flex; }

    .row-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 4px; border: 1px solid transparent;
      background: transparent; color: var(--text2); cursor: pointer; padding: 0;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .row-btn.edit:hover  { background: rgba(59,130,246,0.14); color: var(--accent); border-color: var(--accent); }
    .row-btn.del:hover   { background: rgba(239,68,68,0.14);  color: var(--danger); border-color: var(--danger); }

    .save-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--text2);
      background: transparent; color: var(--text2); cursor: pointer; padding: 0;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .save-btn.mode-edit { border-color: var(--success); color: var(--success); }
    .save-btn.mode-edit:hover { background: rgba(34,197,94,0.14); }
    .save-btn.mode-search:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }

    .app-icon { width: 18px; height: 18px; border-radius: 3px; object-fit: cover; vertical-align: middle; margin-right: 5px; flex-shrink: 0; }

    .status-bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 7px;
      padding: 5px 10px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text2);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); flex-shrink: 0; transition: background 0.2s; }
    .status-dot.ok   { background: var(--success); }
    .status-dot.busy { background: var(--warn); }
    .status-dot.err  { background: var(--danger); }

    .overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    .confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px 22px; max-width: 360px; width: 90%; }
    .confirm-box p { margin: 0 0 14px; line-height: 1.5; }
    .confirm-box .pkg-label { font-family: monospace; font-size: 12px; color: var(--danger); word-break: break-all; }
    .confirm-row { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-cancel  { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 12px; }
    .btn-del-confirm { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--danger); background: var(--danger); color: #fff; cursor: pointer; font-size: 12px; }

    .type-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .type-badge.third-party { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .type-badge.built-in    { background: rgba(156,163,175,0.15); color: #9ca3af; }
    [data-theme="light"] .type-badge.third-party { background: rgba(37,99,235,0.1); color: #1d4ed8; }
    [data-theme="light"] .type-badge.built-in    { background: rgba(107,114,128,0.1); color: #6b7280; }
    .type-switch { display: inline-flex; border-radius: 5px; overflow: hidden; border: 1px solid #333; }
    .type-switch button { padding: 3px 8px; font-size: 10px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; background: transparent; color: #555; transition: background 0.1s, color 0.1s; white-space: nowrap; }
    .type-switch button:not(:last-child) { border-right: 1px solid #333; }
    .type-switch button.active { background: #2a2a2a; color: #ccc; }
    .type-switch button[data-val="true"].active  { background: rgba(59,130,246,0.2); color: #93c5fd; border-color: #3b82f6; }
    .type-switch button[data-val="false"].active { background: rgba(156,163,175,0.15); color: #9ca3af; }
    [data-theme="light"] .type-switch { border-color: #ddd; }
    [data-theme="light"] .type-switch button { color: #aaa; }
    [data-theme="light"] .type-switch button:not(:last-child) { border-color: #ddd; }
    [data-theme="light"] .type-switch button.active { background: #f0f0f0; color: #333; }
    [data-theme="light"] .type-switch button[data-val="true"].active  { background: rgba(37,99,235,0.1); color: #1d4ed8; }
    [data-theme="light"] .type-switch button[data-val="false"].active { background: rgba(107,114,128,0.1); color: #6b7280; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.75s linear infinite; }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="topbar">
    <script>document.write(TopBar.brandHTML)</script>
    <div class="v-sep"></div>
    <div style="flex:1; padding:0 12px; font-size:13px; color:var(--topbar-muted,#888); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
      Known Apps Management
    </div>
    <div class="topbar-right">
      <script>document.write(TopBar.monitoringBtnHTML)</script>
      <script>document.write(TopBar.manageDevicesBtnHTML)</script>
      <script>document.write(TopBar.configMenuHTML)</script>
    </div>
  </header>

  <div class="content">

    <!-- Action bar -->
    <div class="action-bar">
      <button class="action-btn" id="btn-refresh-web">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.55"/></svg>
        Search and update applications information from the web
      </button>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;user-select:none;" title="Force re-download of all app icons from the web, even if already cached locally">
        <input type="checkbox" id="chk-force-icons" style="cursor:pointer;">
        Force icons re-download
      </label>
      <button class="action-btn danger" id="btn-clear">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Clear known applications table
      </button>
    </div>

    <!-- Table card -->
    <div class="table-card">
      <div class="table-scroll" id="table-scroll">
        <table id="apps-table">
          <colgroup>
            <col class="col-el">
            <col class="col-pkg">
            <col class="col-dn">
            <col class="col-iu">
            <col class="col-li">
            <col class="col-ty">
            <col class="col-er">
          </colgroup>
          <thead>
            <!-- Header row -->
            <tr class="hdr-row">
              <th class="col-el"></th>
              <th class="col-pkg">Package Name</th>
              <th class="col-dn">Display Name</th>
              <th class="col-iu">Icon URL</th>
              <th class="col-li">Local Icon</th>
              <th class="col-ty">Type</th>
              <th class="col-er"></th>
            </tr>
            <!-- Search / edit row (dual-purpose) -->
            <tr class="input-row" id="input-row">
              <td style="text-align:center">
                <button class="save-btn mode-search" id="btn-save" title="Clear search">
                  <svg id="btn-save-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
              </td>
              <td><input type="text" id="in-pkg"      placeholder="Search package..."      autocomplete="off" spellcheck="false"></td>
              <td><input type="text" id="in-display"  placeholder="Search display name..."  autocomplete="off"></td>
              <td><input type="text" id="in-icon-url" placeholder="Search icon URL..."      autocomplete="off" spellcheck="false"></td>
              <td><input type="text" id="in-local"    placeholder="Search local icon..."    autocomplete="off" spellcheck="false"></td>
              <td style="text-align:center">
                <div class="type-switch" id="type-switch">
                  <button data-val="" class="active" title="Show all types">All</button>
                  <button data-val="true"  title="Show third-party apps only">3rd Party</button>
                  <button data-val="false" title="Show built-in apps only">Built-in</button>
                </div>
              </td>
              <td></td>
            </tr>
          </thead>
          <tbody id="apps-body">
            <!-- data rows injected by JS -->
          </tbody>
        </table>
      </div>

      <div class="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading...</span>
      </div>
    </div>

  </div><!-- .content -->
</div><!-- .page-wrap -->

<!-- Delete confirm overlay -->
<div class="overlay" id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <p>Delete app entry<br><span class="pkg-label" id="confirm-pkg"></span>?<br>This cannot be undone.</p>
    <div class="confirm-row">
      <button class="btn-cancel" id="confirm-cancel">Cancel</button>
      <button class="btn-del-confirm" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
(function () {
  var _apps    = [];
  var _editPkg = null;   // null = search mode, string = package being edited
  var _delPkg  = null;

  var tbody   = document.getElementById('apps-body');
  var btnSave = document.getElementById('btn-save');
  var inPkg   = document.getElementById('in-pkg');
  var inDN    = document.getElementById('in-display');
  var inIU    = document.getElementById('in-icon-url');
  var inLI    = document.getElementById('in-local');
  var _typeFilter = '';   // '', 'true' (third-party), or 'false' (built-in)

  // Wire up type-switch buttons
  document.getElementById('type-switch').addEventListener('click', function(e) {
    var btn = e.target.closest('button[data-val]');
    if (!btn || _editPkg !== null) return;
    _typeFilter = btn.dataset.val;
    this.querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b === btn); });
    renderTable();
  });

  var SVG_SEARCH = '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>';
  var SVG_CHECK  = '<polyline points="20 6 9 17 4 12"/>';

  function setStatus(msg, state) {
    document.getElementById('status-text').textContent = msg;
    document.getElementById('status-dot').className = 'status-dot' + (state ? ' ' + state : '');
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Switch button icon and styling between search and edit modes
  function syncBtn() {
    var icon = document.getElementById('btn-save-icon');
    if (_editPkg !== null) {
      btnSave.className = 'save-btn mode-edit';
      btnSave.title = 'Save changes';
      icon.innerHTML = SVG_CHECK;
    } else {
      btnSave.className = 'save-btn mode-search';
      btnSave.title = 'Clear search';
      icon.innerHTML = SVG_SEARCH;
    }
  }

  function loadApps() {
    setStatus('Loading...', 'busy');
    fetch('/api/appnames')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        _apps = d.apps || [];
        renderTable();
        setStatus(_apps.length + ' apps', 'ok');
      })
      .catch(function(e) { setStatus('Load failed: ' + e.message, 'err'); });
  }

  var _measureCtx = (function() {
    var c = document.createElement('canvas');
    return c.getContext('2d');
  })();

  function adjustPkgColumnWidth() {
    if (!_apps.length) return;
    _measureCtx.font = '12px Consolas, monospace';
    var maxW = _apps.reduce(function(m, app) {
      return Math.max(m, _measureCtx.measureText(app.PackageName || '').width);
    }, _measureCtx.measureText('Package Name').width);
    var col = document.querySelector('#apps-table col.col-pkg');
    if (col) col.style.width = (Math.ceil(maxW) + 12) + 'px';
  }

  // Render table, applying search filters when in search mode
  function renderTable() {
    var fPkg = inPkg.value.trim().toLowerCase();
    var fDN  = inDN.value.trim().toLowerCase();
    var fIU  = inIU.value.trim().toLowerCase();
    var fLI  = inLI.value.trim().toLowerCase();
    var filtering = (_editPkg === null);

    tbody.innerHTML = '';
    _apps.forEach(function(app) {
      if (filtering) {
        if (fPkg && !(app.PackageName   || '').toLowerCase().includes(fPkg)) return;
        if (fDN  && !(app.DisplayName   || '').toLowerCase().includes(fDN))  return;
        if (fIU  && !(app.IconUrl       || '').toLowerCase().includes(fIU))  return;
        if (fLI  && !(app.LocalIconPath || '').toLowerCase().includes(fLI))  return;
        if (_typeFilter !== '' && String(app.ThirdParty) !== _typeFilter)   return;
      }

      var tr = document.createElement('tr');
      tr.dataset.pkg = app.PackageName;
      if (_editPkg === app.PackageName) tr.classList.add('editing');

      var typeBadge = app.ThirdParty === true
                    ? '<span class="type-badge third-party">3rd Party</span>'
                    : app.ThirdParty === false
                        ? '<span class="type-badge built-in">Built-in</span>'
                        : '<span style="color:var(--text2);font-size:11px">-</span>';

      var iconHtml = app.LocalIconPath
        ? '<img src="' + esc(app.LocalIconPath) + '" class="app-icon" onerror="this.style.display=\'none\'">'
        : '';

      tr.innerHTML =
        '<td class="col-el" style="text-align:center">' +
          '<button class="row-btn edit" data-edit="' + esc(app.PackageName) + '" title="Edit">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
          '</button>' +
        '</td>' +
        '<td class="col-pkg pkg-cell" title="' + esc(app.PackageName) + '">' + esc(app.PackageName) + '</td>' +
        '<td class="col-dn  dn-cell"  title="' + esc(app.DisplayName)  + '">' + iconHtml + esc(app.DisplayName) + '</td>' +
        '<td class="col-iu url-cell" title="' + esc(app.IconUrl) + '">' +
          esc(app.IconUrl) +
          '<button class="row-btn copy-btn" data-copy="' + esc(app.IconUrl) + '" title="Copy">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '</button>' +
        '</td>' +
        '<td class="col-li url-cell" title="' + esc(app.LocalIconPath) + '">' +
          esc(app.LocalIconPath) +
          '<button class="row-btn copy-btn" data-copy="' + esc(app.LocalIconPath) + '" title="Copy">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '</button>' +
        '</td>' +
        '<td class="col-ty">' + typeBadge + '</td>' +
        '<td class="col-er" style="text-align:center">' +
          '<button class="row-btn del" data-del="' + esc(app.PackageName) + '" title="Delete">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</td>';

      tbody.appendChild(tr);
    });
    adjustPkgColumnWidth();
  }

  // Reset to search mode (clear all inputs and filters)
  function clearInputRow() {
    inPkg.value = ''; inDN.value = ''; inIU.value = ''; inLI.value = '';
    inPkg.readOnly = false;
    inPkg.style.opacity = '';
    _editPkg = null;
    tbody.querySelectorAll('tr.editing').forEach(function(r) { r.classList.remove('editing'); });
    syncBtn();
    renderTable();
  }

  // Load a row's values and switch to edit mode
  function loadRow(app) {
    inPkg.value = app.PackageName   || '';
    inDN.value  = app.DisplayName   || '';
    inIU.value  = app.IconUrl       || '';
    inLI.value  = app.LocalIconPath || '';
    inPkg.readOnly = true;
    inPkg.style.opacity = '0.6';
    _editPkg = app.PackageName;
    syncBtn();
    tbody.querySelectorAll('tr').forEach(function(r) {
      r.classList.toggle('editing', r.dataset.pkg === app.PackageName);
    });
    document.getElementById('table-scroll').scrollTo({ top: 0, behavior: 'smooth' });
    inDN.focus();
  }

  function doSave() {
    var pkg = inPkg.value.trim();
    if (!pkg) { inPkg.focus(); return; }
    var payload = {
      PackageName:   pkg,
      DisplayName:   inDN.value.trim(),
      IconUrl:       inIU.value.trim(),
      LocalIconPath: inLI.value.trim(),
      ThirdParty:    (_apps.find(function(a) { return a.PackageName === pkg; }) || {}).ThirdParty ?? null
    };
    setStatus('Saving...', 'busy');
    fetch('/api/appnames/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { clearInputRow(); loadApps(); }
      else { setStatus('Save failed: ' + (d.error || ''), 'err'); }
    })
    .catch(function(e) { setStatus('Save error: ' + e.message, 'err'); });
  }

  // Tick = save in edit mode; search icon = clear filters in search mode
  btnSave.addEventListener('click', function() {
    if (_editPkg !== null) { doSave(); } else { clearInputRow(); }
  });

  // Live search: only active when not editing a row
  [inPkg, inDN, inIU, inLI].forEach(function(inp) {
    inp.addEventListener('input', function() {
      if (_editPkg === null) renderTable();
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && _editPkg !== null) { e.preventDefault(); doSave(); }
    });
  });

  function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(function() { copyFallback(text); });
    } else {
      copyFallback(text);
    }
  }

  function copyFallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  tbody.addEventListener('click', function(e) {
    var copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      copyToClipboard(copyBtn.dataset.copy);
      return;
    }
    var editBtn = e.target.closest('[data-edit]');
    if (editBtn) {
      var pkg = editBtn.dataset.edit;
      var app = _apps.find(function(a) { return a.PackageName === pkg; });
      if (app) loadRow(app);
      return;
    }
    var delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      _delPkg = delBtn.dataset.del;
      document.getElementById('confirm-pkg').textContent = _delPkg;
      document.getElementById('confirm-overlay').style.display = 'flex';
    }
  });

  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('confirm-ok').addEventListener('click', function() {
    if (!_delPkg) return;
    closeConfirm();
    var pkg = _delPkg; _delPkg = null;
    setStatus('Deleting...', 'busy');
    fetch('/api/appnames/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ PackageName: pkg })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { if (_editPkg === pkg) clearInputRow(); loadApps(); }
      else { setStatus('Delete failed: ' + (d.error || ''), 'err'); }
    })
    .catch(function(e) { setStatus('Delete error: ' + e.message, 'err'); });
  });

  function closeConfirm() {
    document.getElementById('confirm-overlay').style.display = 'none';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('confirm-overlay').style.display !== 'none') {
        closeConfirm(); _delPkg = null;
      } else if (_editPkg !== null) {
        clearInputRow();
      }
    }
  });

  document.getElementById('btn-clear').addEventListener('click', function() {
    if (!confirm('Archive the current app names table and start fresh?\n\nThe current file will be renamed with a date suffix (_old_YYYY.MM.DD-HH.MM).')) return;
    setStatus('Archiving...', 'busy');
    fetch('/api/appnames/clear', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) { clearInputRow(); loadApps(); }
        else { setStatus('Clear failed: ' + (d.error || ''), 'err'); }
      })
      .catch(function(e) { setStatus('Clear error: ' + e.message, 'err'); });
  });

  var _resolvePoller = null;
  var _resolveOrigHTML = null;
  var _resolveBtn = null;

  function _resolveResetBtn() {
    if (_resolveBtn) { _resolveBtn.disabled = false; _resolveBtn.innerHTML = _resolveOrigHTML; }
  }

  function _resolveStartPolling() {
    if (_resolvePoller) return;
    _resolvePoller = setInterval(function() {
      fetch('/api/resolve-progress')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.status === 'done') {
            clearInterval(_resolvePoller); _resolvePoller = null;
            var summary = (d.total > 0) ? ' (' + d.done + ' / ' + d.total + ' packages)' : '';
            setStatus('Online search complete' + summary, 'ok');
            _resolveResetBtn(); loadApps();
          } else if (d.status === 'error') {
            clearInterval(_resolvePoller); _resolvePoller = null;
            setStatus('Search failed: ' + (d.error || 'unknown error'), 'err');
            _resolveResetBtn();
          } else if (d.done !== undefined && d.total > 0) {
            setStatus('Searching online... ' + d.done + ' / ' + d.total + ' packages', 'busy');
          }
        })
        .catch(function() {});
    }, 3000);
  }

  document.getElementById('btn-refresh-web').addEventListener('click', function() {
    _resolveBtn = this;
    _resolveOrigHTML = this.innerHTML;
    this.disabled = true;
    this.innerHTML =
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.55"/></svg>' +
      ' Searching online...';
    setStatus('Querying MetaMetadata for missing app info - this may take a few minutes...', 'busy');
    var forceIcons = document.getElementById('chk-force-icons').checked;
    fetch('/api/resolve-app-names', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({forceOnline: forceIcons}) })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.status === 'no_internet') {
          setStatus('No internet connection - search skipped', 'err');
          _resolveResetBtn();
        } else if (d.status === 'already_running') {
          setStatus('Search already in progress...', 'busy');
          _resolveStartPolling();
        } else if (d.status === 'started') {
          setStatus('Searching online... (this may take a few minutes)', 'busy');
          _resolveStartPolling();
        } else {
          setStatus('Unexpected response: ' + d.status, 'err');
          _resolveResetBtn();
        }
      })
      .catch(function(e) {
        setStatus('Refresh error: ' + e.message, 'err');
        _resolveResetBtn();
      });
  });

  syncBtn();
  loadApps();

  // Always-on 15s poll: lock/unlock the web-search button across all browsers
  function _syncResolveState() {
    fetch('/api/resolve-progress')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var running = d.status === 'queued' || d.status === 'running';
        if (running && _resolveBtn && !_resolveBtn.disabled) {
          _resolveOrigHTML = _resolveBtn.innerHTML;
          _resolveBtn.disabled = true;
          _resolveBtn.innerHTML =
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.55"/></svg>' +
            ' Searching online...';
          setStatus('Online search already in progress...', 'busy');
          _resolveStartPolling();
        } else if (!running && _resolveBtn && _resolveBtn.disabled && !_resolvePoller) {
          _resolveResetBtn();
        }
      })
      .catch(function() {});
  }
  _resolveBtn = document.getElementById('btn-refresh-web');
  _resolveOrigHTML = _resolveBtn ? _resolveBtn.innerHTML : null;
  _syncResolveState();
  setInterval(_syncResolveState, 15000);
})();
</script>
</body>
</html>
