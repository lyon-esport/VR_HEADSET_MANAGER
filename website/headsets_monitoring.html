<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Headsets - Monitoring</title>
  <link rel="stylesheet" href="assets/topbar.css">
  <script src="assets/topbar.js"></script>
  <style>
    :root {
      --bg:                 #111;
      --muted:              #444;
      --text:               #ccc;
      --th-bg:              #1a1a1a;
      --tr-hover:           #1c1c1e;
      --border:             #222;
      --ping-ok:            #22c55e;
      --ping-ko:            #ef4444;
      --scrcpy-ok:          #3b82f6;
      --scrcpy-ko:          #a06030;
      --charging:           #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    #refresh-indicator { color: #3b82f6; }

    /* ── Page content ── */
    .page { padding: 24px; }
    h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ddd;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--th-bg);
      padding: 9px 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--tr-hover); }
    td {
      padding: 8px 12px;
      color: var(--text);
      white-space: nowrap;
      text-align: center;
    }

    /* Launch app button in table */
    .mon-launch-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; padding: 0;
      background: #1e1e1e; border: 1px solid #333; border-radius: 4px;
      color: #555; cursor: pointer; text-decoration: none;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .mon-launch-btn:hover {
      color: #3b82f6; border-color: rgba(59,130,246,0.5);
      background: rgba(59,130,246,0.1);
    }

    /* Status pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-green  { background: rgba(34,197,94,0.15);  color: var(--ping-ok); }
    .pill-red    { background: rgba(239,68,68,0.12);  color: var(--ping-ko); }
    .pill-blue   { background: rgba(59,130,246,0.15); color: var(--scrcpy-ok); }
    .pill-orange { background: rgba(160,96,48,0.18);  color: var(--scrcpy-ko); }
    .pill-yellow { background: rgba(250,204,21,0.12); color: var(--charging); }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* App icon */
    .app-icon {
      width: 20px; height: 20px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 6px;
      object-fit: contain;
    }
    .app-name { vertical-align: middle; }

    #empty-msg {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    #empty-msg .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }
    #empty-msg .empty-add-btn {
      display: inline-flex; align-items: center; gap: 7px;
      margin-top: 14px;
      padding: 8px 18px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 6px;
      color: #3b82f6;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    #empty-msg .empty-add-btn:hover {
      background: rgba(59,130,246,0.22);
      border-color: rgba(59,130,246,0.6);
    }

    /* ── Light mode ─────────────────────────────────────────────────────────── */
    [data-theme="light"] {
      --bg:        #f0f0f0;
      --muted:     #999;
      --text:      #222;
      --th-bg:     #e8e8e8;
      --tr-hover:  #ececec;
      --border:    #d8d8d8;
    }
    [data-theme="light"] h1                { color: #111; }
    [data-theme="light"] .table-wrap       { border-color: var(--border); }
    [data-theme="light"] thead th          { border-color: var(--border); }
    [data-theme="light"] tbody tr          { border-color: var(--border); }
    [data-theme="light"] .mon-launch-btn   { background: #e8e8e8; border-color: #c8c8c8; color: #555; }
    [data-theme="light"] .mon-launch-btn:hover { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.5); color: #3b82f6; }

    /* ── Computer monitoring dropdown ── */
    .comp-section {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .comp-section summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--th-bg);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      user-select: none;
      list-style: none;
    }
    .comp-section summary::-webkit-details-marker { display: none; }
    .comp-section summary .chevron {
      margin-left: auto;
      transition: transform 0.2s;
    }
    .comp-section[open] summary .chevron { transform: rotate(90deg); }
    .comp-body {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .comp-card {
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 13px;
    }
    [data-theme="light"] .comp-card { background: #e8e8e8; }
    .comp-card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .comp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 2px 0;
      gap: 8px;
    }
    .comp-row .lbl { color: #666; white-space: nowrap; }
    .comp-row .val { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
    .comp-bar-wrap {
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    [data-theme="light"] .comp-bar-wrap { background: #ccc; }
    .comp-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s;
    }
    .comp-ts {
      grid-column: 1 / -1;
      font-size: 11px;
      color: #555;
      text-align: right;
      padding-top: 2px;
    }
    .comp-workload-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .comp-workload-table th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: right;
      padding: 2px 4px 5px;
    }
    .comp-workload-table th:first-child { text-align: left; }
    .comp-workload-table td {
      padding: 3px 4px;
      text-align: right;
      white-space: nowrap;
      color: var(--text);
    }
    .comp-workload-table td:first-child { text-align: left; color: #888; }
    .comp-workload-card { grid-column: 1 / -1; }

    .comp-refresh-btn {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      background: none; border: 1px solid #333; border-radius: 4px;
      color: var(--muted); font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      cursor: pointer; transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .comp-refresh-btn:hover { color: #3b82f6; border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.08); }
    .comp-refresh-btn.spinning svg { animation: comp-spin 0.7s linear infinite; }
    @keyframes comp-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="topbar">
    <script>document.write(TopBar.brandHTML)</script>
    <div class="v-sep"></div>
    <!-- Compact picker (shown when topbar overflows) -->
    <script>document.write(TopBar.compactDropdownHTML)</script>
    <span class="topbar-title">Headsets Monitoring</span>

    <!-- Center: status filters -->
    <div class="topbar-filters" id="status-filters">
      <span class="filter-label">Show:</span>
      <script>document.write(TopBar.filtersHTML)</script>
    </div>

    <div class="topbar-right">
      <span id="refresh-indicator" style="padding:0 14px;font-size:11px;display:none;">Refreshing...</span>
      <script>document.write(TopBar.monitoringBtnHTML)</script>
      <script>document.write(TopBar.manageDevicesBtnHTML)</script>
      <script>document.write(TopBar.configMenuHTML)</script>
    </div>
  </header>

  <div class="page">
    <div class="table-wrap">
      <table id="headsets-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>IP Address</th>
            <th>Ping</th>
            <th>ADB WiFi</th>
            <th>Scrcpy</th>
            <th>Charging</th>
            <th>Power</th>
            <th>Battery</th>
            <th>Remaining Time</th>
            <th>Ctrl L</th>
            <th>Ctrl R</th>
            <th>Temp</th>
            <th>Model</th>
            <th>Running App</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="16" id="empty-msg">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <details class="comp-section" id="comp-section">
      <summary>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Computer Statistics
        <button class="comp-refresh-btn" id="comp-refresh-btn" title="Force immediate refresh" onclick="event.preventDefault();forceCompRefresh()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.49"/></svg>
          Refresh
        </button>
        <svg class="chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </summary>
      <div class="comp-body" id="comp-body">
        <div style="color:#555;font-size:12px;padding:8px 0">Loading computer stats...</div>
      </div>
    </details>
  </div>

  <script>
    var CSV_PATH      = '../data/known_headsets_infos.csv';
    var CSV_DELIMITER = ';';
    var REFRESH_MS    = 2000;
    var activeFilter  = 'all';
    var lastRows      = [];

    TopBar.initFilters(function(f) { activeFilter = f; applyFilter(); });
    TopBar.initCompact();
    TopBar.initManageDevicesBtn();

    function applyFilter() {
      var rows = document.querySelectorAll('#table-body tr[data-ping]');
      rows.forEach(function(tr) {
        var ping   = tr.dataset.ping   === 'true';
        var scrcpy = tr.dataset.scrcpy === 'true';
        var show = true;
        if (activeFilter === 'online')  show = ping;
        if (activeFilter === 'scrcpy')  show = scrcpy;
        if (activeFilter === 'offline') show = !ping;
        tr.style.display = show ? '' : 'none';
      });
    }

    function parseCsv(text) {
      text = text.replace(/^\uFEFF/, '');
      var lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      var headers = lines[0].split(CSV_DELIMITER).map(function(h) {
        return h.replace(/^"|"$/g, '').trim();
      });
      return lines.slice(1).map(function(line) {
        var cols = line.split(CSV_DELIMITER).map(function(c) {
          return c.replace(/^"|"$/g, '').trim();
        });
        var obj = {};
        headers.forEach(function(h, i) { obj[h] = cols[i] !== undefined ? cols[i] : ''; });
        return obj;
      });
    }

    function pill(text, cls) {
      return '<span class="pill ' + cls + '">' + esc(text) + '</span>';
    }

    function fmtMin(m) {
      var n = parseInt(m, 10);
      if (isNaN(n) || n <= 0) return '-';
      var h = Math.floor(n / 60), mm = n % 60;
      return h > 0 ? h + 'h ' + mm + 'm' : mm + 'm';
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTable(rows) {
      var body = document.getElementById('table-body');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="16" id="empty-msg">' +
          '<div class="empty-title">No headsets found in the known headsets list.</div>' +
          '<div><a class="empty-add-btn" href="headsets_settings.html#manage">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            'Click here to add your first headset' +
          '</a></div>' +
        '</td></tr>';
        return;
      }
      body.innerHTML = rows.map(function(r) {
        var dn       = (r['Name'] || '').replace(/ /g, '_');
        var pingOk   = (r['Ping']    || '').toLowerCase() === 'true';
        var adbOk    = (r['ADBWifi'] || '').toLowerCase() === 'true';
        var scrcpyOk = (r['SCRCPY']  || '').toLowerCase() === 'ok';
        var charging = (r['Charging']|| '').toLowerCase() === 'true';
        var chargingWattage = r['ChargingWattage'] || '';
        var chargingLabel = (charging && chargingWattage && chargingWattage !== '-') ? chargingWattage + ' W' : (charging ? 'Yes' : 'No');
        var powerState = (r['PowerState'] || '-').toLowerCase();
        var powerPill  = powerState === 'charging'    ? pill('Charging',    'pill-green')
                       : powerState === 'discharging' ? pill('Discharging', 'pill-orange')
                       : '<span style="color:#333">-</span>';
        var timeCell = fmtMin(r['TimeRemainingMin'] || '-');

        var appCell = '';
        if (r['RunningApp'] && r['RunningApp'] !== '-') {
          var icon = r['RunningAppIcon'] || '';
          appCell = (icon ? '<img class="app-icon" src="' + esc(icon) + '" onerror="this.style.display=\'none\'">' : '') +
                    '<span class="app-name">' + esc(r['RunningApp']) + '</span>';
        } else {
          appCell = '<span style="color:#333">-</span>';
        }

        var pingStr   = pingOk   ? 'true' : 'false';
        var scrcpyStr = scrcpyOk ? 'true' : 'false';
        return '<tr data-ping="' + pingStr + '" data-scrcpy="' + scrcpyStr + '">' +
          '<td>' + esc(r['ID'] || '') + '</td>' +
          '<td><strong>' + esc(r['Name'] || '') + '</strong></td>' +
          '<td style="font-family:monospace;font-size:12px">' + esc(r['IPAddress'] || '') + '</td>' +
          '<td class="center">' + pill(pingOk ? 'OK' : 'KO', pingOk ? 'pill-green' : 'pill-red') + '</td>' +
          '<td class="center">' + pill(adbOk  ? 'OK' : 'KO', adbOk  ? 'pill-green' : 'pill-red') + '</td>' +
          '<td class="center">' + pill(scrcpyOk ? 'OK' : 'OFF', scrcpyOk ? 'pill-blue' : 'pill-orange') + '</td>' +
          '<td class="center">' + (charging ? pill(chargingLabel,'pill-green') : pill('No','pill-red')) + '</td>' +
          '<td class="center">' + powerPill + '</td>' +
          '<td>' + esc(r['Battery'] || '-') + '</td>' +
          '<td style="color:#888;font-size:12px">' + esc(timeCell) + '</td>' +
          '<td>' + esc(r['BatteryControllerLeft']  || '-') + '</td>' +
          '<td>' + esc(r['BatteryControllerRight'] || '-') + '</td>' +
          '<td>' + esc(r['Temp'] || '-') + (r['Temp'] && r['Temp'] !== '-' ? ' C' : '') + '</td>' +
          '<td style="color:#666">' + esc(r['Model'] || '-') + '</td>' +
          '<td>' + appCell + '</td>' +
          '<td><button class="mon-launch-btn" data-launch-app="' + dn + '" title="Launch an app on ' + esc(r['Name'] || '') + '">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          '</button></td>' +
        '</tr>';
      }).join('');
    }

    function pollCsv() {
      var ind = document.getElementById('refresh-indicator');
      ind.style.display = 'inline';
      fetch(CSV_PATH + '?_=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function(text) {
          renderTable(parseCsv(text));
          applyFilter();
          ind.style.display = 'none';
        })
        .catch(function() { ind.style.display = 'none'; });
    }

    // ── Computer monitoring ──────────────────────────────────────────────────
    var COMP_JSON_PATH  = '../data/computer_monitoring.json';
    var COMP_REFRESH_MS = 30000;

    function barColor(pct) {
      if (pct >= 85) return '#ef4444';
      if (pct >= 60) return '#f97316';
      return '#3b82f6';
    }

    function compBar(pct) {
      var p = Math.min(100, Math.max(0, pct || 0));
      return '<div class="comp-bar-wrap"><div class="comp-bar" style="width:' + p + '%;background:' + barColor(p) + '"></div></div>';
    }

    function renderComp(d) {
      var body = document.getElementById('comp-body');
      if (!d) { body.innerHTML = '<div style="color:#555;font-size:12px;padding:4px 0">No data yet. Computer stats are collected once per minute.</div>'; return; }
      var html = '';

      // CPU card
      if (d.CPU) {
        var c = d.CPU;
        html += '<div class="comp-card">' +
          '<div class="comp-card-title">CPU</div>' +
          (c.Model ? '<div class="comp-row"><span class="lbl">Model</span><span class="val" style="font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis" title="' + esc(c.Model) + '">' + esc(c.Model) + '</span></div>' : '') +
          '<div class="comp-row"><span class="lbl">Cores</span><span class="val">' + esc(c.PhysicalCores) + 'P / ' + esc(c.LogicalCores) + 'L</span></div>' +
          '<div class="comp-row"><span class="lbl">Load</span><span class="val">' + esc(c.LoadPercent) + ' %</span></div>' +
          compBar(c.LoadPercent) +
          '</div>';
      }

      // RAM card
      if (d.RAM) {
        var r = d.RAM;
        html += '<div class="comp-card">' +
          '<div class="comp-card-title">RAM</div>' +
          '<div class="comp-row"><span class="lbl">Type</span><span class="val">' + esc(r.Generation || '-') + (r.SpeedMHz ? ' ' + esc(r.SpeedMHz) + ' MHz' : '') + '</span></div>' +
          '<div class="comp-row"><span class="lbl">Total</span><span class="val">' + esc(r.TotalGB) + ' GB</span></div>' +
          '<div class="comp-row"><span class="lbl">Used</span><span class="val">' + esc(r.UsedGB) + ' GB (' + esc(r.UsedPercent) + '%)</span></div>' +
          '<div class="comp-row"><span class="lbl">Free</span><span class="val">' + esc(r.FreeGB) + ' GB</span></div>' +
          compBar(r.UsedPercent) +
          '</div>';
      }

      // GPU cards
      if (d.GPU && d.GPU.length) {
        d.GPU.forEach(function(g) {
          var load3d = (g.Load3DPercent != null) ? g.Load3DPercent : null;
          var vramUsed = (g.VramUsedPercent != null) ? g.VramUsedPercent : null;
          html += '<div class="comp-card">' +
            '<div class="comp-card-title">GPU ' + (d.GPU.length > 1 ? esc(g.Index) + ' ' : '') + '</div>' +
            (g.Model ? '<div class="comp-row"><span class="lbl">Model</span><span class="val" style="font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis" title="' + esc(g.Model) + '">' + esc(g.Model) + '</span></div>' : '') +
            '<div class="comp-row"><span class="lbl">VRAM</span><span class="val">' + esc(g.DedicatedVramGB) + ' GB</span></div>' +
            (load3d != null ? '<div class="comp-row"><span class="lbl">3D Load</span><span class="val">' + esc(load3d) + ' %</span></div>' + compBar(load3d) : '') +
            (vramUsed != null ? '<div class="comp-row" style="margin-top:4px"><span class="lbl">VRAM used</span><span class="val">' + esc(g.VramUsedGB) + ' GB (' + esc(vramUsed) + '%)</span></div>' + compBar(vramUsed) : '') +
            '</div>';
        });
      }

      // Process workload card (full-width)
      if (d.AppWorkload && d.AppWorkload.length) {
        var rows = d.AppWorkload.map(function(w) {
          return '<tr>' +
            '<td>' + esc(w.ProcessName) + '</td>' +
            '<td>' + esc(w.Count) + '</td>' +
            '<td>' + esc(w.TotalCpuPct) + ' %</td>' +
            '<td>' + esc(w.TotalMemoryMB) + ' MB</td>' +
            '</tr>';
        }).join('');
        html += '<div class="comp-card comp-workload-card">' +
          '<div class="comp-card-title">Process workload' +
            (d.ScrcpyCount ? ' &nbsp;<span style="color:#3b82f6;font-size:11px;font-weight:600">' + esc(d.ScrcpyCount) + ' scrcpy running</span>' : '') +
          '</div>' +
          '<table class="comp-workload-table">' +
            '<thead><tr><th>Process</th><th>Count</th><th>CPU</th><th>RAM</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
          '</div>';
      }

      // Timestamp
      if (d.Timestamp) {
        html += '<div class="comp-ts">Last update: ' + esc(d.Timestamp.replace('T', ' ')) + '</div>';
      }

      body.innerHTML = html || '<div style="color:#555;font-size:12px">No data available.</div>';
    }

    function pollComp() {
      fetch(COMP_JSON_PATH + '?_=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d) { renderComp(d); })
        .catch(function() { renderComp(null); });
    }

    function forceCompRefresh() {
      var btn = document.getElementById('comp-refresh-btn');
      btn.classList.add('spinning');
      btn.disabled = true;
      fetch('/api/computer-monitoring/force-refresh', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function() {
          // Poll for updated data — the VRMonitor loop runs every few seconds,
          // so retry up to ~15 s until the timestamp in the file changes.
          var before = null;
          var bodyEl = document.getElementById('comp-body');
          var tsEl = bodyEl ? bodyEl.querySelector('.comp-ts') : null;
          if (tsEl) before = tsEl.textContent;
          var attempts = 0;
          var check = setInterval(function() {
            attempts++;
            fetch(COMP_JSON_PATH + '?_=' + Date.now())
              .then(function(r) { return r.json(); })
              .then(function(d) {
                var newTs = d.Timestamp ? d.Timestamp.replace('T', ' ') : null;
                var changed = newTs && (!before || before.indexOf(newTs) === -1);
                if (changed || attempts >= 15) {
                  clearInterval(check);
                  btn.classList.remove('spinning');
                  btn.disabled = false;
                  renderComp(d);
                }
              })
              .catch(function() {
                if (attempts >= 15) { clearInterval(check); btn.classList.remove('spinning'); btn.disabled = false; }
              });
          }, 1000);
        })
        .catch(function() { btn.classList.remove('spinning'); btn.disabled = false; });
    }

    pollComp();
    setInterval(pollComp, COMP_REFRESH_MS);
    // ── /Computer monitoring ─────────────────────────────────────────────────

    pollCsv();
    setInterval(pollCsv, REFRESH_MS);

    document.getElementById('headsets-table').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-launch-app]');
      if (btn) openLaunchModal(btn.dataset.launchApp);
    });
  </script>
  <script src="assets/app_launcher.js"></script>
</body>
</html>
