<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Battery History - VR Headset Manager</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
</head>
<body>
  <!-- The battery graph became one metric of metric_history.html. This page stays
       behind as a redirect so bookmarks, an OBS browser source, or a link pasted
       into a chat still land on the right chart instead of a 404.

       replace(), not assign(): the operator should not have to press Back twice
       to leave a page that only ever forwards. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var q = '?id=' + (parseInt(p.get('id'), 10) || 0) +
              '&metric=battery' +
              '&hours=' + (p.get('hours') || '24');
      location.replace('metric_history.html' + q);
    })();
  </script>
  <noscript><a href="metric_history.html?metric=battery">Open the metric history page</a></noscript>
</body>
</html>
