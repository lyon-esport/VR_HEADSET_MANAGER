<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<title>VRHM</title>
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Item number">
			<sdpi-textfield setting="index" pattern="[0-9]+" placeholder="1"></sdpi-textfield>
		</sdpi-item>
		<p style="font-size:11px;opacity:.7;padding:0 8px">N-th favourite app (apps page) or N-th kiosk screen (kiosks page) of the selected headset.</p>
		<sdpi-item label="VRHM server">
			<sdpi-textfield setting="serverUrl" global placeholder="http://localhost:8080"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
